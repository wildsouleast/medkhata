<main id="main">
<div class="auth"><div class="card">
  <h1>Start your free trial</h1>
  <div class="trial-pill">⏳ 7 days free, all features. Then from ₹49/month. No card needed.</div>
  <form class="form" id="signup-form" novalidate>
    <div class="field"><label for="s-store">Store name</label><input id="s-store" name="store_name" autocomplete="organization" required maxlength="80" placeholder="e.g. Sharma Medical Hall"></div>
    <div class="row2">
      <div class="field"><label for="s-owner">Owner name</label><input id="s-owner" name="owner_name" autocomplete="name" required maxlength="60"></div>
      <div class="field"><label for="s-city">City</label><input id="s-city" name="city" autocomplete="address-level2" required maxlength="60"></div>
    </div>
    <div class="field"><label for="s-phone">Mobile number</label><input id="s-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" required maxlength="14" placeholder="10-digit mobile number"><div class="hint">You will use this number to log in.</div></div>
    <div class="field"><label for="s-email">Email <span class="muted">(optional)</span></label><input id="s-email" name="email" type="email" autocomplete="email" maxlength="120"></div>
    <div class="field"><label for="s-pass">Create password</label><div class="pw"><input id="s-pass" name="password" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-toggle-pw="s-pass">Show</button></div><div class="hint">At least 8 characters.</div></div>
    <label class="check"><input type="checkbox" id="s-terms" name="accept_terms"> <span>I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</span></label>
    <div class="alert alert-error" id="s-err" role="alert" hidden></div>
    <button class="btn btn-primary btn-block" type="submit">Start free trial</button>
  </form>
  <p class="center small" style="margin:18px 0 0">Already have an account? <a href="/login">Log in</a></p>
